apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostics-agent
  namespace: reference-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diagnostics-agent-read
  namespace: reference-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["reference-app"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnostics-agent-read
  namespace: reference-staging
subjects:
  - kind: ServiceAccount
    name: diagnostics-agent
    namespace: reference-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diagnostics-agent-read
