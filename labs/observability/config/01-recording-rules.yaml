groups:
  - name: reference-app-recording
    rules:
      - record: reference_app:http_request_duration_p95_seconds
        expr: |
          histogram_quantile(0.95,
            sum by (le, service_name, environment, route, method, status_class) (
              rate(http_server_request_duration_seconds_bucket[1m])
            )
          )
      - record: reference_app:http_request_rate
        expr: |
          sum by (service_name, environment, route, method, status_class) (
            rate(http_server_request_duration_seconds_count[1m])
          )
