name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install review tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Run contract tests
        run: python -m unittest discover -v
      - name: Review Python source
        run: bandit -q -r src -ll -ii

  source-security:
    name: Source security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan repository
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          version: v0.70.0

  image-gate:
    name: Image gate
    needs: [quality, source-security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ai-native-devops/reference-service:ci-${{ github.sha }}
      - name: Scan built image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ai-native-devops/reference-service:ci-${{ github.sha }}
          scan-type: image
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          version: v0.70.0
      - name: Verify runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="reference-service-ci"
          cleanup() {
            docker logs "$container_name" > ci-container.log 2>&1 || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:8080:8080 \
            "ai-native-devops/reference-service:ci-${GITHUB_SHA}"
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1
      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-container-log-${{ github.sha }}
          path: ci-container.log
          if-no-files-found: warn
          retention-days: 7
