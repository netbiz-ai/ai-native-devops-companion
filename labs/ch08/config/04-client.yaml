apiVersion: v1
kind: Pod
metadata:
  name: reference-client
  labels:
    app.kubernetes.io/name: reference-client
    ai-native-devops.dev/chapter: ch08
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: registry.example.invalid/reference-app@sha256:REPLACE_WITH_APPROVED_DIGEST
      command:
        - python3
        - -c
        - "import time; time.sleep(300)"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
