name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Installed from the lock rather than requirements.txt so CI validates
      # the exact resolved set recorded in the repository, which is also the
      # set Chapter 11's dependency scan reports against.
      - name: Install reference-app dependencies
        run: pip install -r reference-app/requirements.lock
      - name: Validate offline baseline
        run: ./scripts/validate-offline.sh

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build reviewed image
        run: docker build -t reference-app:${{ github.sha }} reference-app
      - name: Run as non-root
        run: |
          test "$(docker image inspect reference-app:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
      - name: Exercise health contract
        run: |
          container_id="$(docker run -d -p 127.0.0.1::8080 reference-app:${{ github.sha }})"
          trap 'docker rm -f "$container_id"' EXIT
          port="$(docker port "$container_id" 8080/tcp | awk -F: '{print $NF}')"
          for _ in $(seq 1 20); do
            curl --fail --silent "http://127.0.0.1:${port}/health" && exit 0
            sleep 1
          done
          docker logs "$container_id"
          exit 1
