name: Delivery

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Reviewed release/run identifier
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: reference-app
          push: true
          tags: ghcr.io/${{ github.repository }}/reference-app:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record candidate identity
        run: |
          printf 'release_id=%s\nsource_revision=%s\nimage_digest=%s\n' \
            '${{ inputs.release_id }}' '${{ github.sha }}' '${{ steps.build.outputs.digest }}'

  staging:
    needs: candidate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging handoff
        env:
          IMAGE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ./scripts/validate-offline.sh
          printf 'staging_candidate=%s\n' "$IMAGE_DIGEST"

  production:
    needs: [candidate, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record approved promotion
        env:
          IMAGE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'promotion=approved image_digest=%s\n' "$IMAGE_DIGEST"
          printf 'Update the production GitOps overlay by reviewed pull request.\n'
