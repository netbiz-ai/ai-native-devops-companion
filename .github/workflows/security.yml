name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # Private repositories without GitHub Advanced Security cannot upload
          # to code scanning, so retain the portable SARIF as run evidence.
          output: codeql-results
          upload: false
          upload-database: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results/*.sarif
          retention-days: 30

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a token to scan a pull request; without it
      # the job fails before scanning. It only surfaced on this repository's
      # first pull request.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # v0.35.0 safe commit named in Aqua's March 2026 incident guidance.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          # One file, named exactly, and only because it is not a manifest.
          # ch10-lab-faults.yaml is a strategic-merge patch: a container stanza
          # carrying two environment variables and nothing else. Trivy reads it
          # as a standalone Deployment and reports the security context it does
          # not restate, which the base it patches already sets. Restating the
          # context here to satisfy the scanner would duplicate the base and
          # invite the two to drift apart, which is a worse outcome than this
          # line. Kustomize renders the patched result; scan that, not the patch.
          # Chapter 12s fault is the same shape as Chapter 10s: a container
          # stanza carrying one environment variable. It was added without
          # this line and turned Security red from f149211 onward.
          skip-files: |
            deployment/gitops/overlays/staging/ch10-lab-faults.yaml
            deployment/gitops/overlays/incident/ch12-latency-fault.yaml

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t reference-app:${{ github.sha }} reference-app
      # v0.35.0 safe commit named in Aqua's March 2026 incident guidance.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: reference-app:${{ github.sha }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
