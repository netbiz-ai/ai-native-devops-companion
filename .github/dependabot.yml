# Pinning by commit SHA makes an action immutable and makes it stale, and the
# second is the usual objection to the first. Dependabot answers it: it opens a
# pull request when a pinned action publishes a new release, and the update
# arrives as a reviewed change with a new SHA rather than as a tag that moved
# underneath a workflow.
#
# Updates land like any other change here: through a pull request, against the
# protected checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    # codeql-action/init and codeql-action/analyze are two paths into one
    # action, and CodeQL refuses to run when the two are on different
    # versions: analyze fails with "Loaded a configuration file for version
    # X, but running version Y". Dependabot names each path as its own
    # dependency, so an ungrouped bump arrives as two pull requests that
    # cannot pass alone and leave main red between the two merges. Grouping
    # them makes the pair arrive as the single change it always was.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

    # Six of these actions are also pinned in the manuscript, and Chapter 5
    # records the reviewed identity of each. A major bump accepted here alone
    # puts the book and its executable counterpart back into the disagreement
    # issue #3 was about, and the manuscript cannot follow without a render.
    # So majors for those six are the author's decision, taken with the book;
    # patches and minors still arrive, and every action not shared with the
    # book updates without restriction.
    ignore:
      - dependency-name: actions/checkout
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/setup-python
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
      - dependency-name: docker/build-push-action
        update-types: ["version-update:semver-major"]
      - dependency-name: docker/setup-buildx-action
        update-types: ["version-update:semver-major"]
      # trivy-action is pre-1.0, so every release it publishes is a semver
      # minor and none of them are caught by the rule above. The pin is also
      # not an ordinary version choice: 0.35.0 is the commit named in Aqua's
      # March 2026 incident guidance, which security.yml says at the call
      # site. Its updates are worth reading rather than taking.
      - dependency-name: aquasecurity/trivy-action
        update-types: ["version-update:semver-major"]
