groups:
  - name: reference-app-recording
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job, environment) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job:http_errors:ratio5m
        expr: |
          sum by (job, environment) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum by (job, environment) (rate(http_server_request_duration_seconds_count[5m])), 0.001)
      - record: job:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job, environment) (rate(http_server_request_duration_seconds_bucket[5m]))
          )
