apiVersion: v1
kind: Namespace
metadata:
  name: reference-dev
  labels:
    app.kubernetes.io/part-of: ai-native-devops
    # Chapter 8 proves that Restricted admission rejects a noncompliant Pod.
    # Without these labels nothing is enforced, the negative test passes for
    # the wrong reason, and the chapter demonstrates nothing. The workload in
    # this base already satisfies Restricted: non-root uid 10001, no privilege
    # escalation, all capabilities dropped, read-only root, RuntimeDefault
    # seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    ai-native-devops.dev/owner-token: tafohelvis@gmail.com
