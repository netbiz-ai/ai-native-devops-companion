apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-app
  namespace: reference
  labels:
    app.kubernetes.io/name: reference-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reference-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reference-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: reference-app
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_HOST
              value: "0.0.0.0"
            # Points the application's OTLP exporter (HTTP protocol, so port
            # 4318) at the lab Collector that observability/collector-deployment.yaml
            # deploys. telemetry.py installs no exporter when this is unset, so
            # without it the printed live-series checks can never see data.
            # Declared here rather than set imperatively so that
            # `kubectl apply -k deployment/gitops/overlays/staging/` governs the
            # value and the chapter's restore step actually restores it.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
