apiVersion: v1
kind: Pod
metadata:
  name: reference-client
  namespace: reference
  labels:
    app.kubernetes.io/name: reference-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: client
      image: python:3.12-alpine
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
