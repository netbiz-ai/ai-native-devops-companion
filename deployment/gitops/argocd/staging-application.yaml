apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-staging
  namespace: argocd
spec:
  project: ai-native-devops
  source:
    repoURL: https://github.com/netbiz-ai/ai-native-devops-companion.git
    targetRevision: main
    path: deployment/gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: reference-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
