apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-staging
  namespace: argocd
spec:
  project: ai-native-devops
  source:
    # Argo CD reconciles from Git, not from your working tree, so this must
    # name a repository the cluster can reach and you can push your edited
    # `deployment/` to - your fork, or the disposable in-cluster server in
    # ../lab-source. The URL below is the upstream companion, which you cannot
    # push to and whose base kustomization still carries the placeholder
    # digest. A private source also needs the read-only credential named in
    # ../README.md.
    repoURL: git://lab-git.lab-source.svc.cluster.local/repo.git
    targetRevision: main
    path: deployment/gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: reference-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
