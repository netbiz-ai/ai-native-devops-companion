apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-native-devops
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/netbiz-ai/ai-native-devops-companion.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: reference-staging
    - server: https://kubernetes.default.svc
      namespace: reference-production
  # Namespace is cluster-scoped. It was listed as a namespaced resource while
  # clusterResourceWhitelist was empty, so the controller refused to create it
  # and refused every namespaced kind besides, because none were listed. Every
  # sync failed with "is not permitted in project".
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Exactly what the overlays render, and nothing else.
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: "*"
