apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reference-production
resources:
  - ../../../kubernetes/base
  # This environment's own Namespace, carrying its own owner token. The base's
  # Namespace is dropped just below rather than renamed: renaming it rendered the
  # base's REPLACE_WITH_OWNER_TOKEN into this environment, so the first Argo CD
  # sync overwrote whatever token the reader had applied here, and
  # labs/gitops/02-apply-namespaces.sh then refused the namespace forever as an
  # ownership collision.
  - namespace.yaml
patches:
  - target:
      kind: Namespace
      name: reference-dev
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: reference-dev
      $patch: delete
commonLabels:
  app.kubernetes.io/environment: production
