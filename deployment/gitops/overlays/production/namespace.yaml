# deployment/gitops/overlays/production/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: reference-production
  labels:
    ai-native-devops.dev/chapter: ch09
    app.kubernetes.io/part-of: ai-native-devops
    # The same four labels the base sets. This file is what the overlay renders,
    # so anything omitted here is not enforced in this environment - enforce
    # alone admits the workload but audits and warns about nothing.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    ai-native-devops.dev/owner-token: REPLACE_WITH_PRODUCTION_OWNER
