# A minimal disposable cluster for the Chapter 8+ labs.
#
# disableDefaultCNI is deliberate: create-cluster.sh installs Calico instead,
# because kind's default plugin does not enforce the NetworkPolicy the labs
# observe. Do not apply this file directly - create-cluster.sh passes it to
# kind and finishes the registry wiring the cluster needs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
